<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운세 주사위 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎲 운세 주사위 게임 🔮</h1>

        <!-- 생년월일시 입력 섹션 -->
        <div id="birth-input-section" class="section">
            <h2>당신의 운명을 입력하세요</h2>
            <div class="birth-form">
                <div class="input-group">
                    <label>생년월일</label>
                    <input type="date" id="birthdate" required>
                </div>
                <div class="input-group">
                    <label>출생 시간</label>
                    <select id="birth-hour">
                        <option value="">선택하세요</option>
                        <option value="23-1">자시 (23:00-01:00)</option>
                        <option value="1-3">축시 (01:00-03:00)</option>
                        <option value="3-5">인시 (03:00-05:00)</option>
                        <option value="5-7">묘시 (05:00-07:00)</option>
                        <option value="7-9">진시 (07:00-09:00)</option>
                        <option value="9-11">사시 (09:00-11:00)</option>
                        <option value="11-13">오시 (11:00-13:00)</option>
                        <option value="13-15">미시 (13:00-15:00)</option>
                        <option value="15-17">신시 (15:00-17:00)</option>
                        <option value="17-19">유시 (17:00-19:00)</option>
                        <option value="19-21">술시 (19:00-21:00)</option>
                        <option value="21-23">해시 (21:00-23:00)</option>
                    </select>
                </div>
                <button id="start-btn" class="btn-primary">운명 확인하기</button>
            </div>
        </div>

        <!-- 운세 정보 섹션 -->
        <div id="fortune-section" class="section hidden">
            <div class="fortune-cards">
                <div class="card zodiac-card">
                    <h3>🌟 별자리 성향</h3>
                    <div id="zodiac-info"></div>
                </div>
                <div class="card saju-card">
                    <h3>🔮 사주 운세</h3>
                    <div id="saju-info"></div>
                </div>
            </div>

            <!-- 캐릭터 스탯 -->
            <div class="stats-panel">
                <h3>⚡ 기본 능력치</h3>
                <div id="base-stats"></div>
            </div>
        </div>

        <!-- 게임 섹션 -->
        <div id="game-section" class="section hidden">
            <div class="game-panel">
                <h3>🎲 주사위 게임</h3>
                <div class="daily-fortune">
                    <p><strong>오늘의 운세:</strong> <span id="daily-fortune-text"></span></p>
                    <p><strong>운세 보정:</strong> <span id="fortune-modifier"></span></p>
                </div>

                <div class="dice-container">
                    <div id="dice-display" class="dice">?</div>
                    <button id="roll-btn" class="btn-primary">주사위 굴리기</button>
                </div>

                <div class="game-stats">
                    <div class="stat-item">
                        <span>점수:</span>
                        <span id="score">0</span>
                    </div>
                    <div class="stat-item">
                        <span>굴린 횟수:</span>
                        <span id="roll-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>최고 점수:</span>
                        <span id="high-score">0</span>
                    </div>
                </div>

                <div id="result-message" class="result-message"></div>
            </div>
        </div>
    </div>

    <script src="zodiac.js"></script>
    <script src="saju.js"></script>
    <script src="game.js"></script>
</body>
</html>
